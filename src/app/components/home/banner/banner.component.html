<section class="section banner">
    <div [@bannerTrigger] class="container">
        <div class="section-box-banner">
            <div class="content">
                <div>
                    <h1>{{"Banner.Pretitle" | translate}}</h1>
                </div>

              <div class='banner-title'>
                    <h2>{{"Banner.name" | translate}}</h2>
                    <h5 class="banner-role">{{"Banner.jobTitle" | translate}}</h5>
                    <span class="info-badge mt-3"><i class="fas fa-map-marker-alt"></i> <span [innerHTML]='"Banner.Location" | translate'></span></span>
                </div>
                <div class='banner-description'>
                    <p [innerHTML]='"Banner.Description" | translate' class="mt-4"></p>
                </div>
            </div>

            <div class="div-btn-banner">
                <a (click)='analyticsService.sendAnalyticEvent("click_send_mail", "banner", "email")' href="mailto:saleemhalzoubi@gmail.com" target="_blank" class="main-btn">
                    {{"Banner.ActionBtn" | translate}}
                </a>
                <a (click)='analyticsService.sendAnalyticEvent("click_cv", "banner", "cv")' href="assets/cv/Saleem_Alzoubi_CTO.pdf" target="_blank" class="secondary-btn">
                    <i class="fas fa-file-download mr-2"></i>{{"Header.cvBtn" | translate}}
                </a>
            </div>

          <div class="banner-qr">
            <img class="rounded" width="110" height="110" src="assets/images/cvQrCode.png" alt="Saleem Alzoubi CV QR code">
            <p [innerHTML]='"Banner.scanPdf" | translate'></p>
          </div>

        </div>
    </div>
</section>
