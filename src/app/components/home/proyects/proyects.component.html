<section class="section proyects" id="proyects">
  <div class="container">
    <div class="section-box">
      <div data-aos="fade-up" data-aos-duration="1000">
        <h3 class="section-title">
          <span class="n-section-title">03.</span> {{ "FeatureProjects.Title" | translate }}
        </h3>
        <p class="projects-subtitle">{{ "FeatureProjects.Subtitle" | translate }}</p>
      </div>

      <article *ngFor="let project of projects; let i = index"
               class="project-card" [class.project-card--current]="project.Company === 'Sawaed Elm'"
               data-aos="fade-up" data-aos-duration="800">

        <div class="project-media" *ngIf="project.imgs?.length; else visual"
             (mouseenter)="paused[i] = true" (mouseleave)="paused[i] = false">
          <img *ngFor="let img of project.imgs; let n = index" class="project-img"
               [class.active]="n === (slide[i] || 0)" [src]="img" [alt]="project.Title + ' screenshot ' + (n + 1)"
               loading="lazy">
          <div class="slider-dots" *ngIf="project.imgs.length > 1">
            <button type="button" *ngFor="let img of project.imgs; let n = index"
                    [class.active]="n === (slide[i] || 0)" (click)="goTo(i, n)"
                    [attr.aria-label]="'Show screenshot ' + (n + 1)"></button>
          </div>
        </div>

        <ng-template #visual>
          <div class="project-media">
          <div class="project-visual">
            <div class="project-visual-grid"></div>
            <i [class]="project.Icon"></i>
            <span class="project-visual-label">{{ project.Company || project.Title }}</span>
          </div>
          </div>
        </ng-template>

        <div class="project-body">
          <div class="project-meta" *ngIf="project.Company || project.Role">
            <span class="project-company" *ngIf="project.Company">{{ project.Company }}</span>
            <span class="project-role" *ngIf="project.Role">{{ project.Role }}</span>
          </div>
          <h4 class="project-title">{{ project.Title }}</h4>

          <div class="project-description" [class.expanded]="expanded[i]">
            <p class="mb-0" [innerHTML]="project.Description"></p>
          </div>
          <button type="button" class="project-toggle" (click)="expanded[i] = !expanded[i]">
            {{ expanded[i] ? 'Show less' : 'Read more' }}
            <i class="fas" [class.fa-chevron-down]="!expanded[i]" [class.fa-chevron-up]="expanded[i]"></i>
          </button>

          <ul class="project-tech">
            <li *ngFor="let technology of project.Technologies">{{ technology }}</li>
          </ul>
        </div>
      </article>
    </div>
  </div>
</section>
